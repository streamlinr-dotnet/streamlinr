[tools]
dotnet = "10.0.300"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "true"

[tasks.restore]
description = "Restore packages and tools"
run = [
    "dotnet tool restore",
    "dotnet restore"
]

[tasks.clean]
description = "Clean build outputs"
run = "dotnet clean Streamlinr.slnx --configuration Release --verbosity minimal"

[tasks.build]
description = "Build the full solution in Release configuration"
depends = ["clean", "restore"]
run = "dotnet build --no-restore Streamlinr.slnx --configuration Release"

[tasks.test]
description = "Run unit tests only"
depends = ["build"]
run = [
  "dotnet test --no-build Streamlinr.Tests.Architecture --configuration Release",
  "dotnet test --no-build Streamlinr.Tests.Core.Unit --configuration Release",
  "dotnet test --no-build Streamlinr.Tests.Unit --configuration Release",
]

[tasks.integration]
description = "Run Kafka integration tests"
depends = ["build"]
run = "dotnet test --no-build Streamlinr.Tests.Integration --configuration Release"

[tasks.package]
description = "Create the Streamlinr NuGet package"
depends = ["build"]
run = "dotnet pack --no-build Streamlinr/Streamlinr.csproj --configuration Release --no-build --output artifacts/packages"
